# The databases of `FUDE_DB=postgres mix test` and `FUDE_DB=mysql mix test`,
# at the ports and passwords that Fude.QueryTest uses. The tests make their
# own databases.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
